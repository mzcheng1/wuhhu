<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Welcome to Wuhhu.">
  <title>Wuhhu</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; color: #172033; background: linear-gradient(145deg, #f2f7ff, #fff7f1); }
    main { width: min(100%, 720px); padding: clamp(2rem, 7vw, 5rem); border: 1px solid #ffffff; border-radius: 28px; background: rgba(255,255,255,.82); box-shadow: 0 24px 80px rgba(36, 61, 100, .12); }
    .eyebrow { color: #596b8b; font-size: .85rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: .5rem 0 1rem; font-size: clamp(3rem, 10vw, 5.5rem); line-height: 1; letter-spacing: -.06em; }
    p { max-width: 48ch; color: #526078; font-size: 1.1rem; line-height: 1.7; }
    a { display: inline-block; margin-top: 1rem; padding: .85rem 1.15rem; border-radius: 999px; color: white; background: #3159c9; font-weight: 650; text-decoration: none; }
    a:hover { background: #2446a8; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">A little corner of the web</div>
    <h1>Wuhhu</h1>
    <p>Your website is live. Replace this welcome message with whatever you want people to see, and add your own pages, photos, and links.</p>
    <a href="https://github.com/mzcheng1/wuhhu">View the project on GitHub</a>
  </main>
</body>
</html>
