<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upcoming Events | Wuhhu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #416db2;
      --cream: #f1eee7;
      --black: #090a0d;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--cream);
      font-family: 'Montserrat', sans-serif;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      width: 100%;
      position: relative;
      overflow: hidden;
      background-image:
        linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.25)),
        url("warehouse.png");
      background-size: cover;
      background-position: 5% center;
      background-repeat: no-repeat;
      background-color: #090a0d;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      width: 75%;
      padding: 20px 0 120px 5%;
    }

    .eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(30px, 4vw, 54px);
      letter-spacing: 5px;
      margin-left: 16%;
      color: #fff;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(65px, 11vw, 175px);
      line-height: .85;
      letter-spacing: -7px;
      white-space: nowrap;
      color: var(--cream);
      text-shadow: 0 5px 25px rgba(0,0,0,.3);
    }

    .hero h1 span { color: var(--blue); }

    .event-info { font-weight: 500; }
    .event-info sup { font-size: 10px; letter-spacing: 0; }
    .event-info .venue { margin-top: 12px; }

    .separator {
      height: 2px;
      background: var(--cream);
      opacity: .7;
    }

    .ticket-button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--cream);
      border-radius: 40px;
      padding: 15px 25px;
      color: var(--cream);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      background: rgba(0,0,0,.35);
      transition: .3s;
    }

    .ticket-button:hover {
      background: var(--blue);
      border-color: var(--blue);
      transform: translateY(-4px);
    }

    /* DESKTOP: ticket block centered in the space left of the dancers */
    @media (min-width: 901px) {
      .event-info, .ticket-label, .separator, .ticket-button {
        --shift: 7vw;
      }
      .event-info {
        width: 31vw;
        margin: 35px 0 0 var(--shift);
        text-align: center;
        letter-spacing: 6px;
        font-size: clamp(12px, 1.5vw, 20px);
      }
      .separator {
        width: 125px;
        margin: 40px 0 30px calc(var(--shift) + (31vw - 125px) / 2);
      }
      .ticket-label {
        width: 31vw;
        margin: 0 0 20px var(--shift);
        text-align: center;
        letter-spacing: 6px;
        font-size: 13px;
      }
      .ticket-button {
        width: 18vw;
        min-width: 0;
        margin: 0 0 0 calc(var(--shift) + (31vw - 18vw) / 2);
      }
    }

    /* HERO FOOTER BAR */
    .hero-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      min-height: 85px;
      padding: 10px 4%;
      border-top: 1px solid rgba(255,255,255,.5);
      background: rgba(0,0,0,.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }
    .bottom-logo { font-family: 'Cormorant Garamond', serif; font-size: 24px; letter-spacing: 7px; }
    .tagline { font-size: 10px; font-weight: 600; letter-spacing: 6px; }

    /* MOBILE */
    @media (max-width: 900px) {
      .hero-content { width: 100%; padding-top: 150px; }
      .hero h1 { font-size: 12vw; letter-spacing: -3px; }
    }
    @media (max-width: 600px) {
      .hero { min-height: 100svh; }
      .hero-content { padding: 150px 20px 130px; }
      .eyebrow { margin-left: 5%; font-size: 30px; }
      .hero h1 { white-space: normal; font-size: 17vw; line-height: .9; }
      .event-info { font-size: 12px; letter-spacing: 3px; }
      .ticket-label { font-size: 10px; letter-spacing: 3px; }
      .ticket-button { width: 85%; }
      .hero-bottom { padding: 15px; min-height: 70px; }
      .bottom-logo { font-size: 17px; }
      .tagline { font-size: 7px; letter-spacing: 2px; }
    }

    /* GALLERY */
    .gallery {
      display: flex;
      flex-wrap: nowrap;
      gap: 2vw;
      padding: 100px 5%;
      background: var(--black);
    }
    .gallery img {
      flex: 1 1 0;
      min-width: 0;
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img src="headers.png" alt="WUHHU home">
    </a>
    <nav aria-label="Main navigation">
      <a href="members.html">Members</a>
      <a href="whoarewe.html">Who Are We</a>
      <a href="upcomingevents.html" aria-current="page">Upcoming Events</a>
      <a href="ourwork.html">Our Work</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main id="events">
    <section class="hero">
      <div class="hero-content">
        <p class="eyebrow">WUHHU PRESENTS:</p>
        <h1>THE <span>BLUEPRINT</span></h1>

        <div class="event-info">
          <p>DECEMBER 4<sup>TH</sup> &amp; 5<sup>TH</sup> • 7 PM</p>
          <p class="venue">EDISON THEATRE</p>
        </div>

        <div class="separator"></div>

        <p class="ticket-label">GET YOUR TICKETS HERE:</p>

        <a href="https://universityservices.washu.edu/our-services/washu-box-office/"
           target="_blank" rel="noopener noreferrer" class="ticket-button">
          GET TICKETS <span>↗</span>
        </a>
      </div>

      <div class="hero-bottom">
        <span class="bottom-logo">WUHHU</span>
        <span class="tagline">DANCE • COMMUNITY • CULTURE</span>
      </div>
    </section>

    <section class="gallery">
      <img src="wrist.png" alt="Wrist">
      <img src="know.png" alt="Know">
      <img src="impt.png" alt="Impt">
    </section>
  </main>

  <script>
    (function () {
      var gallery = document.querySelector('.gallery');
      var imgs = document.querySelectorAll('.gallery img');
      if (!gallery || !imgs.length) return;

      imgs.forEach(function (img) {
        img.style.opacity = '0';
        img.style.transform = 'translateY(60px)';
        img.style.transition = 'opacity .9s ease, transform .9s ease';
      });

      var shown = false;
      function check() {
        if (shown) return;
        if (gallery.getBoundingClientRect().top < window.innerHeight * 0.85) {
          shown = true;
          imgs.forEach(function (img, i) {
            setTimeout(function () {
              img.style.opacity = '1';
              img.style.transform = 'translateY(0)';
            }, i * 250);
          });
        }
      }

      window.addEventListener('scroll', check, { passive: true });
      window.addEventListener('resize', check);
      window.addEventListener('load', check);
      check();
    })();
  </script>
</body>
</html>
