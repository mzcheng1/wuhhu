    <style>
      
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --blue: #416db2;
  --cream: #f1eee7;
  --black: #090a0d;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--black);
  color: var(--cream);
  font-family: 'Montserrat', sans-serif;
}

/* NAVIGATION */

.navbar {
  height: 90px;
  padding: 0 4%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: absolute;
  top: 0;
  width: 100%;
  z-index: 10;
  border-bottom: 1px solid rgba(255,255,255,.35);
  background: rgba(5, 6, 9, .55);
}

.logo {
  color: var(--cream);
  font-family: 'Permanent Marker', cursive;
  font-size: 32px;
  text-decoration: none;
  letter-spacing: -2px;
}

.navbar nav {
  display: flex;
  gap: 34px;
}

.navbar nav a {
  color: white;
  text-decoration: none;
  text-transform: uppercase;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.5px;
  padding-bottom: 8px;
  transition: .3s;
}

.navbar nav a:hover,
.navbar nav a.active {
  border-bottom: 2px solid white;
  color: var(--blue);
}

.menu-toggle {
  display: none;
  background: none;
  color: white;
  border: none;
  font-size: 27px;
  cursor: pointer;
}

/* HERO BACKGROUND */
.hero {
  min-height: 100vh;
  width: 100%;
  position: relative;
  overflow: hidden;

  background-image: url("warehouse.png");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;

  background-color: #090a0d;
}


/* MAIN HERO */

.hero {
  min-height: 100vh;
  width: 100%;
  position: relative;
  overflow: hidden;

  background-image:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.25),
      rgba(0,0,0,.2) 50%,
      rgba(0,0,0,.6)
    ),
    url("./images/warehouse.png");

  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  background-color: #090a0d;
}

/* LARGE CENTERED TITLE */

.hero-heading {
  position: relative;
  z-index: 3;
  text-align: center;
  padding: 145px 3% 20px;
  width: 100%;
}

.eyebrow {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(28px, 3.5vw, 48px);
  letter-spacing: 8px;
  color: white;
  margin-bottom: 5px;
}

.hero-heading h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(65px, 9.5vw, 145px);
  line-height: .9;
  font-weight: 600;
  letter-spacing: -5px;
  color: var(--cream);
  white-space: nowrap;
  text-shadow: 0 5px 25px rgba(0,0,0,.5);
}

.hero-heading h1 span {
  color: var(--blue);
}

/* LOWER SECTION */

.hero-layout {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  min-height: 420px;
  padding: 30px 5% 100px;
}

/* EVENT PANEL ON LEFT */

.event-panel {
  width: 38%;
  max-width: 470px;
  padding: 30px;
  text-align: center;
  background: rgba(5, 6, 9, .55);
  backdrop-filter: blur(5px);
  border: 1px solid rgba(255,255,255,.25);
}

.event-label {
  font-size: 11px;
  letter-spacing: 5px;
  color: var(--blue);
  font-weight: 700;
  margin-bottom: 25px;
}

.event-info {
  font-size: clamp(14px, 1.4vw, 19px);
  font-weight: 600;
  letter-spacing: 4px;
  line-height: 2;
}

.event-info sup {
  font-size: 9px;
  letter-spacing: 0;
}

.event-time {
  color: var(--blue);
}

.venue {
  font-size: 14px;
  letter-spacing: 5px;
  margin-top: 8px;
}

/* SEPARATOR */

.separator {
  width: 90px;
  height: 2px;
  background: var(--cream);
  margin: 25px auto;
  opacity: .7;
}

/* TICKETS */

.ticket-label {
  font-size: 10px;
  letter-spacing: 3px;
  margin-bottom: 18px;
}

.ticket-button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 16px 22px;
  border: 1px solid var(--cream);
  border-radius: 40px;
  color: var(--cream);
  text-decoration: none;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  background: rgba(0,0,0,.4);
  transition: .3s;
}

.ticket-button:hover {
  background: var(--blue);
  border-color: var(--blue);
  transform: translateY(-3px);
}

/* FOOTER */

.hero-bottom {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  min-height: 75px;
  padding: 20px 4%;
  border-top: 1px solid rgba(255,255,255,.4);
  background: rgba(0,0,0,.55);
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 5;
}

.bottom-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  letter-spacing: 7px;
}

.tagline {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 5px;
}

/* TABLET */

@media (max-width: 900px) {
  .hero-heading {
    padding-top: 145px;
  }

  .hero-heading h1 {
    white-space: normal;
    font-size: 10vw;
  }

  .hero-layout {
    min-height: 400px;
  }

  .event-panel {
    width: 45%;
  }
}

/* MOBILE */

@media (max-width: 600px) {
  .hero {
    min-height: 100svh;
    background-position: 62% center;
  }

  .hero-heading {
    padding: 125px 15px 20px;
  }

  .eyebrow {
    font-size: 24px;
    letter-spacing: 4px;
  }

  .hero-heading h1 {
    font-size: 14vw;
    letter-spacing: -2px;
    white-space: normal;
  }

  .hero-layout {
    min-height: 0;
    padding: 30px 20px 110px;
    justify-content: center;
  }

  .event-panel {
    width: 100%;
    max-width: 370px;
    padding: 25px 20px;
    background: rgba(5,6,9,.75);
  }

  .event-info {
    font-size: 14px;
  }

  .hero-bottom {
    padding: 15px;
  }

  .bottom-logo {
    font-size: 17px;
  }

  .tagline {
    font-size: 7px;
    letter-spacing: 2px;
  }

    </style>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>WUHHU | The Blueprint</title>

<main class="hero" id="events">

  <div class="hero-content">

    <p class="eyebrow">WUHHU PRESENTS:</p>

    <h1>
      THE <span>BLUEPRINT</span>
    </h1>

    <div class="event-info">

    </div>

    <div class="separator"></div>

    <p class="ticket-label">GET YOUR TICKETS HERE:</p>

      href="https://universityservices.washu.edu/our-services/washu-box-office/"

  </div>


  <div class="hero-bottom">

      DANCE • COMMUNITY • CULTURE
    </span>
  </div>

</main>


  <script>
const menuToggle = document.getElementById("menuToggle");
const navigation = document.getElementById("navigation");

menuToggle.addEventListener("click", () => {
  navigation.classList.toggle("show");
});

// Close mobile menu after selecting a section
document.querySelectorAll("#navigation a").forEach(link => {
  link.addEventListener("click", () => {
    navigation.classList.remove("show");
  });
});

// Highlight the active navigation link
document.querySelectorAll("#navigation a").forEach(link => {
  link.addEventListener("click", () => {
    document.querySelectorAll("#navigation a").forEach(item => {
      item.classList.remove("active");
    });

    link.classList.add("active");
  });
});
</script>
  
</body>
</html>
