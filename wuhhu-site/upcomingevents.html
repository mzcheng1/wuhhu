    <style>
 
/* HERO CONTENT */

.hero-content {
  position: relative;
  z-index: 3;
  width: 100%;
  padding: 115px 0 120px 4%;
}

/* WUHHU PRESENTS */

.eyebrow {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(28px, 3vw, 46px);
  letter-spacing: 7px;
  margin-left: 5%;
  margin-bottom: 5px;
  color: white;
  width: 42%;
  text-align: center;
}

/* THE BLUEPRINT */

.hero h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: clamp(55px, 7vw, 135px);
  line-height: .95;
  letter-spacing: -4px;
  white-space: nowrap;
  color: var(--cream);
  text-shadow: 0 5px 25px rgba(0,0,0,.4);
}

.hero h1 span {
  color: var(--blue);
}

/* EVENT DETAILS */

.event-info {
  text-align: center;
  margin-top: 35px;
  margin-left: 0;
  width: 42%;
  font-size: clamp(12px, 1.2vw, 19px);
  font-weight: 500;
  letter-spacing: 5px;
  line-height: 2;
}

.event-info sup {
  font-size: 9px;
  letter-spacing: 0;
}

.event-info span {
  margin: 0 8px;
}

.event-info .venue {
  margin-top: 5px;
}

/* SEPARATOR */

.separator {
  width: 100px;
  height: 2px;
  background: var(--cream);
  margin: 30px 0 25px 13%;
  opacity: .7;
}

/* TICKET TEXT */

.ticket-label {
  text-align: center;
  width: 42%;
  letter-spacing: 5px;
  font-size: 11px;
  margin-bottom: 20px;
}

/* TICKET BUTTON */

.ticket-button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 320px;
  margin-left: 5%;
  padding: 16px 25px;
  border: 1px solid var(--cream);
  border-radius: 40px;
  color: var(--cream);
  text-decoration: none;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  transition: .3s;
  background: rgba(0,0,0,.4);
}

.ticket-button:hover {
  background: var(--blue);
  border-color: var(--blue);
  transform: translateY(-4px);
}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WUHHU | The Blueprint</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

 
<main class="hero" id="events">

  <div class="hero-content">

    <p class="eyebrow">WUHHU PRESENTS:</p>

    <h1>
      THE <span>BLUEPRINT</span>
    </h1>

    <div class="event-info">
      <p>DECEMBER 4<sup>TH</sup> & 5<sup>TH</sup> • 7 PM</p>
      <p class="venue">EDISON THEATRE</p>
    </div>

    <div class="separator"></div>

    <p class="ticket-label">GET YOUR TICKETS HERE:</p>

    <a
      href="https://universityservices.washu.edu/our-services/washu-box-office/"
      target="_blank"
      rel="noopener noreferrer"
      class="ticket-button"
    >
      GET TICKETS <span>↗</span>
    </a>

  </div>


  <div class="hero-bottom">
    <span class="bottom-logo">WUHHU</span>
    <span class="tagline">
      DANCE • COMMUNITY • CULTURE
    </span>
  </div>

</main>


  <script>
const menuToggle = document.getElementById("menuToggle");
const navigation = document.getElementById("navigation");

menuToggle.addEventListener("click", () => {
  navigation.classList.toggle("show");
});

// Close mobile menu after selecting a section
document.querySelectorAll("#navigation a").forEach(link => {
  link.addEventListener("click", () => {
    navigation.classList.remove("show");
  });
});

// Highlight the active navigation link
document.querySelectorAll("#navigation a").forEach(link => {
  link.addEventListener("click", () => {
    document.querySelectorAll("#navigation a").forEach(item => {
      item.classList.remove("active");
    });

    link.classList.add("active");
  });
});
</script>
