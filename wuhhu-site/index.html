<style>
/* =====================
   GLOBAL STYLE
===================== */
body {
  margin: 0;
  font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
  background: #ffffff;
  color: #1a1a1a;
}

/* =====================
   HERO SECTION
===================== */
.hero {
  height: 90vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  overflow: hidden;
  color: white;
}

/* background image */
.hero {
  position: relative;
  overflow: hidden;
}
.hero-gif {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 75% 75%;
  transform: scale(1.15);
  z-index: 0;
}

.hero-content {
  position: relative;
  z-index: 1;
}

/* content box */
.hero-content {
  position: relative;
  max-width: 850px;
  padding: 30px;
}

/* TITLE */
.hero h1 {
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 64px;
  margin-bottom: 12px;
  color: #ffffff;
  font-weight: 700;
  letter-spacing: 1px;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
}

/* SUBTITLE (your sentence) */
.hero-subtitle {
  font-size: 22px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.5;
  margin-top: 0;
  margin-bottom: 28px;
  text-shadow: 0 2px 15px rgba(0, 0, 0, 0.35);
  max-width: 760px;
}
  <body>

<div class="nav-overlay"></div>

<section class="hero">

    <!-- Background GIF -->
    <img src="WUHHU.gif" alt="" class="hero-gif">

    <!-- Hero Text -->
    <div class="hero-content">
        <h1>WUHHU</h1>

        <h2 class="hero-subtitle">
           WashU's Premier Hip Hop Team.
        </h2>

</body>
</html>
