  <style>
.video-hero {
  position: relative;
  width: 100vw;
  margin-left: calc(-50vw + 50%);
  margin-right: calc(-50vw + 50%);
  height: 50vh;   /* was 80vh — adjust to whatever feels right */
  overflow: hidden;
}

.video-hero-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;   /* keep at 100% — always fill whatever height .video-hero is */
  object-fit: cover;
  object-position: center 60%;
}
.video-hero-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
}

.video-hero-content {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
  padding: 0 2rem;
}

.video-hero-content h1 {
  font-family: "Oswald", sans-serif;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  font-weight: 900;
  margin: 0 0 1rem;
}

.video-hero-content p {
  font-family: "Oswald", sans-serif;
  font-size: clamp(1rem, 2vw, 1.4rem);
  max-width: 40ch;
}
    .showcase-section {
  margin: 4rem auto;
  padding: 0 1rem;
}

.showcase-section:first-of-type {
  margin-top: 2rem; /* a bit more breathing room right after the hero */
}

.showcase-section:last-of-type {
  margin-bottom: 6rem; /* more room before the footer */
}
  </style>
</head>
