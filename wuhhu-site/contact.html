<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Wuhhu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img src="headers.png" alt="WUHHU home">
    </a>
    <nav aria-label="Main navigation">
      <a href="members.html">Members</a>
      <a href="whoarewe.html">Who Are We</a>
      <a href="upcomingevents.html">Upcoming Events</a>
      <a href="ourwork.html">Our Work</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main>
    <p class="eyebrow">Let's connect</p>
    <h1>Contact the team</h1>
    <p class="intro">Want to book us, collaborate, or say hello?</p>

    <section class="contact-box" aria-label="Ways to reach us">
      <div class="contact-email">
        <h2>Email</h2>
        <p>Bookings, collabs, and questions.</p>
        <a href="mailto:hello@example.com">hello@example.com</a>
      </div>

      <div class="contact-socials">
        <div class="contact-social">
          <h2>TikTok</h2>
          <p>Watch our clips.</p>
          <a href="https://www.tiktok.com/@yourhandle" target="_blank" rel="noopener">@yourhandle</a>
        </div>

        <div class="contact-social">
          <h2>Instagram</h2>
          <a class="photo-link" href="https://www.instagram.com/wuhiphopunion/" target="_blank" rel="noopener">
            <img src="insta.jpg" alt="WUHHU on Instagram, @wuhiphopunion">
          </a>
          <a href="https://www.instagram.com/wuhiphopunion/" target="_blank" rel="noopener">@wuhiphopunion</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <strong>WUHHU</strong>
    <span>WashU's Premier Hip Hop Team</span>
  </footer>
</body>
</html>
