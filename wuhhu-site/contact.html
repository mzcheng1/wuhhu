<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Wuhhu</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ---------- One-box contact layout ---------- */
.contact-box {
  background: var(--chalk);
  border: 1px solid #b9bcbe;
  box-shadow: 0 14px 36px rgba(30, 34, 39, 0.22), 0 3px 8px rgba(30, 34, 39, 0.12);
  padding: clamp(1.5rem, 5vw, 3rem);
  margin: 2.5rem 0 3rem;
}

.contact-email h2 { font-size: clamp(2rem, 5vw, 3rem); }

.contact-email a {
  display: inline-block;
  font-family: var(--display);
  font-size: clamp(1.5rem, 4.5vw, 2.5rem);
  font-weight: 400;
  letter-spacing: 0.02em;
  word-break: break-word;
}
.contact-social h2 { margin-top: 0; }

.contact-email p,
.contact-social p { margin-top: 0; }

.contact-email a { font-size: 1.25rem; font-weight: 700; }

.contact-socials {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
  margin-top: 2rem;
  padding-top: 2rem;
  border-top: var(--edge);
}

.contact-social {
  background: var(--concrete);
  border: var(--edge);
  box-shadow: 4px 4px 0 var(--ink);
  padding: 1.1rem 1.1rem 1.4rem;
}

.contact-social a { font-weight: 700; }

.photo-link { display: block; margin: 0.75rem 0; }

.photo-link img {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border: var(--edge);
  transition: transform 0.12s ease;
}

.photo-link:hover img { transform: translate(2px, 2px); }

@media (prefers-reduced-motion: reduce) {
  .photo-link img { transition: none; }
}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img src="headers.png" alt="WUHHU home">
    </a>
    <nav aria-label="Main navigation">
      <a href="members.html">Members</a>
      <a href="whoarewe.html">Who Are We</a>
      <a href="upcomingevents.html">Upcoming Events</a>
      <a href="ourwork.html">Our Work</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Contact the team</h1>
    <p class="intro">Want to book us, collaborate, or say hello?</p>

<section class="contact-box" aria-label="Ways to reach us">
  <div class="contact-email">
    <h2>Email</h2>
    <p>Bookings, collabs, and questions.</p>
    <a href="mailto:hello@example.com">hello@example.com</a>
  </div>

  <div class="contact-socials">
    <div class="contact-social">
      <h2>Instagram</h2>
      <a class="photo-link" href="https://www.instagram.com/wuhiphopunion/" target="_blank" rel="noopener">
        <img src="insta.jpg" alt="WUHHU on Instagram, @wuhiphopunion">
      </a>
      <a href="https://www.instagram.com/wuhiphopunion/" target="_blank" rel="noopener">@wuhiphopunion</a>
    </div>

    <div class="contact-social">
      <h2>TikTok</h2>
      <p>Watch our clips.</p>
      <a href="https://www.tiktok.com/@yourhandle" target="_blank" rel="noopener">@yourhandle</a>
    </div>
  </div>
</section>
  </main>

  <footer class="site-footer">
    <strong>WUHHU</strong>
    <span>WashU's Premier Hip Hop Team</span>
  </footer>
</body>
</html>
