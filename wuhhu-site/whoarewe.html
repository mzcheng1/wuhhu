<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wuhhu | Hip-Hop Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --ink: #1c2733;
      --purple: #461D7C;
      --purple-dark: #33165c;
      --line: rgba(70, 29, 124, 0.16);
    }

    * { box-sizing: border-box; }

    .join-page {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--ink);
      background: #ffffff;
    }

    /* ---------- HERO ---------- */
    .jn-hero {
      position: relative;
      min-height: 45vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .jn-hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .jn-hero img.jn-slide-active {
      opacity: 1;
    }

    .jn-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(28,15,48,0.15) 0%, rgba(28,15,48,0.75) 100%);
      z-index: 1;
    }

    .jn-hero-content {
      position: relative;
      z-index: 2;
      padding: 60px clamp(24px, 6vw, 90px);
      max-width: 100%;
      width: 100%;
      text-align: center;
      margin: 0 auto;
    }

    .jn-hero-content h1 {
      font-family: 'Montserrat', 'Inter', system-ui, sans-serif;
      font-weight: 800;
      color: #ffffff;
      font-size: clamp(48px, 9vw, 110px);
      letter-spacing: 0.02em;
      margin: 0;
      text-shadow: 0 2px 16px rgba(0,0,0,0.25);
    }

    .jn-hero-content p {
      color: rgba(255,255,255,0.92);
      font-size: 1.1rem;
      line-height: 1.7;
      margin: 0;
      max-width: 700px;
    }

    /* ---------- SLIDESHOW CONTROLS ---------- */
    .jn-slide-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      background: rgba(255,255,255,0.18);
      border: none;
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      transition: background 0.2s ease;
    }

    .jn-slide-arrow:hover,
    .jn-slide-arrow:focus-visible {
      background: rgba(255,255,255,0.32);
    }

    .jn-slide-arrow.jn-prev { left: 20px; }
    .jn-slide-arrow.jn-next { right: 20px; }

    .jn-slide-dots {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      gap: 10px;
    }

    .jn-slide-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .jn-slide-dot.jn-slide-dot-active {
      background: #ffffff;
      transform: scale(1.2);
    }

    @media (max-width: 640px) {
      .jn-slide-arrow { width: 38px; height: 38px; font-size: 1.1rem; }
      .jn-slide-arrow.jn-prev { left: 10px; }
      .jn-slide-arrow.jn-next { right: 10px; }
    }

    @media (max-width: 640px) {
      .jn-hero { min-height: 32vh; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img src="headers.png" alt="WUHHU home">
    </a>
    <nav aria-label="Main navigation">
      <a href="members.html">Members</a>
      <a href="whoarewe.html" class="active">Who Are We</a>
      <a href="ourwork.html">Our Work</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="join-page">

    <section class="jn-hero" id="jnHero">
      <div class="jn-hero-content">
        <h1>Who are we</h1>
      </div>
    </section>

  </main>

  <script>
    /* =====================================================
       HERO SLIDESHOW
       Add or remove filenames here as you add photos to the
       GitHub repo. They must live in the same folder as this
       page.
    ===================================================== */
    const heroSlides = [
      "soph.png",
      "team.png",
      "heist.png",
      "senior.png",
      "black.JPG"
    ];

    const heroSlideDuration = 5000; // ms each image stays on screen

    function initHeroSlideshow() {
      const hero = document.getElementById("jnHero");
      if (!hero || heroSlides.length === 0) return;

      /* Per-image crop position ("center X%") — tweak individually as needed */
      const heroSlidePositions = {
        "soph.png": "center 20%",
        "team.png": "center 20%",
        "heist.png": "center 20%",
        "senior.png": "center 20%",
        "black.JPG": "center 20%"
      };

      heroSlides.forEach((src, i) => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = "WUHHU Team";
        img.style.objectPosition = heroSlidePositions[src] || "center 20%";
        if (i === 0) img.classList.add("jn-slide-active");
        hero.prepend(img);
      });

      if (heroSlides.length < 2) return;

      const slideEls = Array.from(hero.querySelectorAll("img"));
      let current = 0;
      let timer;

      function goTo(index) {
        slideEls[current].classList.remove("jn-slide-active");
        current = (index + slideEls.length) % slideEls.length;
        slideEls[current].classList.add("jn-slide-active");

        const dots = hero.querySelectorAll(".jn-slide-dot");
        dots.forEach((dot, i) => {
          dot.classList.toggle("jn-slide-dot-active", i === current);
        });
      }

      function startAutoplay() {
        timer = setInterval(() => goTo(current + 1), heroSlideDuration);
      }

      function restartAutoplay() {
        clearInterval(timer);
        startAutoplay();
      }

      // Prev / next arrow buttons
      const prevBtn = document.createElement("button");
      prevBtn.className = "jn-slide-arrow jn-prev";
      prevBtn.setAttribute("aria-label", "Previous photo");
      prevBtn.innerHTML = "&#8249;";
      prevBtn.addEventListener("click", () => {
        goTo(current - 1);
        restartAutoplay();
      });

      const nextBtn = document.createElement("button");
      nextBtn.className = "jn-slide-arrow jn-next";
      nextBtn.setAttribute("aria-label", "Next photo");
      nextBtn.innerHTML = "&#8250;";
      nextBtn.addEventListener("click", () => {
        goTo(current + 1);
        restartAutoplay();
      });

      hero.appendChild(prevBtn);
      hero.appendChild(nextBtn);

      // Dot indicators
      const dotsWrap = document.createElement("div");
      dotsWrap.className = "jn-slide-dots";
      slideEls.forEach((_, i) => {
        const dot = document.createElement("button");
        dot.className = "jn-slide-dot" + (i === 0 ? " jn-slide-dot-active" : "");
        dot.setAttribute("aria-label", "Go to photo " + (i + 1));
        dot.addEventListener("click", () => {
          goTo(i);
          restartAutoplay();
        });
        dotsWrap.appendChild(dot);
      });
      hero.appendChild(dotsWrap);

      startAutoplay();
    }

    document.addEventListener("DOMContentLoaded", initHeroSlideshow);
  </script>

  <script>
    function setHeaderHeightVar() {
      const header = document.querySelector(".site-header");
      if (header) {
        document.documentElement.style.setProperty(
          "--header-height",
          header.getBoundingClientRect().height + "px"
        );
      }
    }
    setHeaderHeightVar();
    window.addEventListener("resize", setHeaderHeightVar);
    window.addEventListener("load", setHeaderHeightVar);
  </script>
</body>
</html>
