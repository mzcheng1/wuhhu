<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Who Are We | Wuhhu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
   <a class="brand" href="index.html">
  <img src="headers.png" alt="WUHHU home">
</a>
    <nav aria-label="Main navigation">
      <a href="members.html">Members</a>
      <a href="whoarewe.html" aria-current="page">Who Are We</a>
       <a href="ourwork.html">Our Work</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
   <div class="slideshow">
  <img id="about-photo" src="images/soph.png" alt="WUHHU team photo">

  <div class="slideshow-controls">
    <button type="button" id="previous-photo" aria-label="Previous photo">←</button>
    <span id="photo-count">1 / 5</span>
    <button type="button" id="next-photo" aria-label="Next photo">→</button>
  </div>
</div>
  </main>
<footer class="site-footer">
  <div class="footer-wrap">
    <strong>WUHHU</strong>
    <span>WashU's Premier Hip Hop Team</span>
  </div>
</footer>
  <script>
  const photos = [
    { src: "images/soph.png", alt: "Sophomore team photo" },
    { src: "images/black.JPG", alt: "WUHHU team photo" },
    { src: "images/team.png", alt: "WUHHU team photo" },
    { src: "images/heist.png", alt: "WUHHU team photo" },
    { src: "images/senior.png", alt: "Senior team photo" }
  ];

  let currentPhoto = 0;
  const image = document.getElementById("about-photo");
  const count = document.getElementById("photo-count");

  function showPhoto(index) {
    currentPhoto = (index + photos.length) % photos.length;
    image.src = photos[currentPhoto].src;
    image.alt = photos[currentPhoto].alt;
    count.textContent = `${currentPhoto + 1} / ${photos.length}`;
  }

  document.getElementById("previous-photo").addEventListener("click", () => {
    showPhoto(currentPhoto - 1);
  });

  document.getElementById("next-photo").addEventListener("click", () => {
    showPhoto(currentPhoto + 1);
  });
</script>
</body>
</html>
